# Runs in the public mirror (morph-cloud/morphcloud-client), where this folder is the repo root.
# In the backend repo this file sits under client/ and GitHub ignores it.
#
# Every push to main is checked. When package.json carries a version that npm does not have yet,
# that version is STAGED on npm with provenance, and goes live only when a maintainer approves it
# on npmjs.com with their 2FA. There is no npm token: npm trusts this repository's publish.yml
# workflow ("trusted publishing", on the package's settings page) and GitHub proves the
# workflow's identity with a short-lived OIDC token. The trust allows staging only, never a
# direct publish.
name: check-and-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; `npm stage` needs npm 12 (Node 22.22.2+ or 24.15+).
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Is this version new?
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is new"
          fi

      - name: Stage for approval
        if: steps.version.outputs.new == 'true'
        run: npm stage publish . --provenance --access public
